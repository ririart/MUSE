<title>coming soon ✿</title>

<meta property="og:title" content="Under maintenance ✿">
<meta property="og:description" content="Something new is on its way. We're under maintenance and painting something lovely. Come back soon!">
<meta name="theme-color" content="#fff9f3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Shrikhand&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a4a;
    --ink-soft:#5d4b6e;
    --cream:#fff9f3;
    --lilac:#cdb8ff;
    --peach:#ffc8a8;
    --mint:#b4efd2;
    --sky:#b3dbff;
    --pink:#ffb6d9;
    --butter:#fff0a3;
    --pink-deep:#ff8cc3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    background:var(--cream);color:var(--ink);
    font-family:"Fredoka",ui-rounded,system-ui,sans-serif;
    overflow-x:hidden;
    cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><circle cx='14' cy='14' r='9' fill='%23ffb6d9' stroke='%233b2a4a' stroke-width='2.5'/></svg>") 14 14, auto;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  [hidden]{display:none!important}

  /* ---------- dreamy background blobs ---------- */
  .blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(48px)}
  .blob{position:absolute;opacity:.8;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;
        animation:drift 24s ease-in-out infinite alternate,morph 16s ease-in-out infinite alternate}
  .b1{width:48vmax;height:48vmax;background:var(--lilac);top:-18vmax;left:-14vmax}
  .b2{width:44vmax;height:44vmax;background:var(--peach);bottom:-20vmax;right:-12vmax;animation-delay:-7s,-3s}
  .b3{width:34vmax;height:34vmax;background:var(--mint);top:38%;left:-20vmax;animation-delay:-12s,-9s}
  .b4{width:38vmax;height:38vmax;background:var(--sky);top:-16vmax;right:-16vmax;animation-delay:-4s,-12s}
  .b5{width:30vmax;height:30vmax;background:var(--pink);bottom:-14vmax;left:28%;animation-delay:-9s,-6s}
  @keyframes drift{
    0%{transform:translate(0,0) rotate(0deg)}
    50%{transform:translate(6vw,4vh) rotate(40deg)}
    100%{transform:translate(-4vw,8vh) rotate(-20deg)}
  }
  @keyframes morph{
    0%{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}
    50%{border-radius:63% 37% 40% 60%/55% 62% 38% 45%}
    100%{border-radius:37% 63% 55% 45%/38% 50% 50% 62%}
  }

  /* paper grain for an art-print feel */
  .grain{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23 0 0 0 0 .16 0 0 0 0 .29 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* ---------- shapes (doodles + confetti) ---------- */
  .f{fill:currentColor;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .sq-o{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .sq-i{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .ring-o{fill:none;stroke:var(--ink);stroke-width:9}
  .ring-i{fill:none;stroke:currentColor;stroke-width:5}

  .doodle{position:fixed;z-index:2;pointer-events:none;width:clamp(34px,5vw,58px);height:auto;overflow:visible;
          animation:float 7s ease-in-out infinite alternate}
  .d1{top:10%;left:8%;--rot:-12deg}
  .d2{top:13%;right:9%;--rot:10deg;animation-duration:8.5s;width:clamp(46px,7vw,80px)}
  .d3{bottom:15%;left:7%;--rot:8deg;animation-duration:6.5s}
  .d4{bottom:12%;right:8%;--rot:-8deg;animation-duration:9s}
  .d5{top:46%;left:4%;--rot:14deg;animation-duration:7.5s}
  .d6{top:50%;right:5%;--rot:-14deg;animation-duration:8s}
  @keyframes float{
    from{transform:translateY(0) rotate(var(--rot))}
    to{transform:translateY(-16px) rotate(calc(var(--rot) * -1))}
  }

  /* ---------- main content ---------- */
  main{position:relative;z-index:3;flex:1;width:100%;max-width:62rem;margin:0 auto;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
       padding:clamp(3rem,8vh,5rem) 16px 2rem}

  .name{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6em;font-weight:600;font-size:clamp(.9rem,2.4vw,1.05rem);
        letter-spacing:.28em;text-transform:uppercase}
  .name .fl{color:var(--pink-deep);letter-spacing:0;font-size:1.25em}

  .pill{margin-top:1.1rem;display:inline-flex;align-items:center;gap:.55em;padding:.42em 1.05em;
        background:var(--mint);border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
        font-weight:600;font-size:.95rem;transform:rotate(-2.5deg)}
  .dot{width:.65em;height:.65em;border-radius:50%;background:var(--pink-deep);border:2px solid var(--ink);
       animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{transform:scale(.6);opacity:.5}}

  .title-wrap{position:relative;margin-top:clamp(1.2rem,3vh,2rem)}
  .headline{font-family:"Shrikhand",cursive;font-weight:400;font-size:clamp(2.6rem,11.5vw,7.4rem);line-height:1.08;
            display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em}
  .word{display:inline-flex;white-space:nowrap}
  .ch{display:inline-block;color:var(--c,var(--lilac));
      -webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;
      text-shadow:.045em .055em 0 var(--ink);
      transition:color .3s;
      animation:bob 2.6s ease-in-out infinite;animation-delay:calc((12 - var(--i)) * -.14s)}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(var(--r,0deg))}
    50%{transform:translateY(-.08em) rotate(calc(var(--r,0deg) * -1))}
  }


  .sub{margin-top:.5rem;font-family:"Caveat",cursive;font-weight:700;font-size:clamp(1.9rem,5.2vw,2.9rem);line-height:1.15}
  .scribble{position:relative;display:inline-block;white-space:nowrap}
  .scribble svg{position:absolute;left:-4%;bottom:-.16em;width:108%;height:.42em;overflow:visible}
  .scribble path{fill:none;stroke:var(--pink-deep);stroke-width:5;stroke-linecap:round;
                 stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.3s .9s cubic-bezier(.6,0,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .msg{margin-top:1.3rem;max-width:34rem;font-size:clamp(1.02rem,2.6vw,1.15rem);line-height:1.65;color:var(--ink-soft)}

  .loader{margin-top:1.8rem;width:min(21rem,100%)}
  .bar{height:24px;padding:3px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;
       box-shadow:3px 3px 0 var(--ink);overflow:hidden}
  .fill{position:relative;display:block;height:100%;width:10%;border-radius:999px;overflow:hidden;
        animation:grow 9s ease-in-out infinite}
  .fill::before{content:"";position:absolute;top:0;bottom:0;left:-90px;right:-90px;
    background:repeating-linear-gradient(-45deg,var(--lilac) 0 10px,var(--pink) 10px 20px,var(--peach) 20px 30px,
               var(--butter) 30px 40px,var(--mint) 40px 50px,var(--sky) 50px 60px);
    animation:slide 1.6s linear infinite}
  @keyframes slide{to{transform:translateX(84.85px)}}
  @keyframes grow{0%{width:8%}40%{width:64%}50%{width:58%}82%{width:91%}100%{width:8%}}
  .loader-text{margin-top:.55rem;font-family:"Caveat",cursive;font-weight:500;font-size:1.45rem;
               transition:opacity .3s,transform .3s}
  .loader-text.swap{opacity:0;transform:translateY(4px)}

  .actions{margin-top:1.7rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem}
  .socials{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem}
  .music{font-family:inherit;line-height:inherit;cursor:pointer;--bg:var(--lilac)}
  .eq{display:none;align-items:flex-end;gap:2px;height:1.05em;width:1.25em;justify-content:center}
  .eq i{display:block;width:3px;height:40%;background:var(--ink);border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
  .eq i:nth-child(2){animation-delay:-.25s}
  .eq i:nth-child(3){animation-delay:-.5s}
  @keyframes eq{from{height:25%}to{height:100%}}
  .music[aria-pressed="true"] .eq{display:inline-flex}
  .music[aria-pressed="true"] .note{display:none}
  .socials a,.music{display:inline-flex;align-items:center;gap:.5em;padding:.6em 1.15em;
             background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600;font-size:1rem;
             border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
             transition:transform .15s ease,box-shadow .15s ease}
  .socials a:hover,.music:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:5px 5px 0 var(--ink)}
  .socials a:active,.music:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .socials a:focus-visible,.music:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
  .socials svg,.music svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .hint{margin-top:1.6rem;font-family:"Caveat",cursive;font-size:1.4rem;color:var(--ink-soft);transform:rotate(-1.5deg)}
  .hint b{font-weight:700;color:var(--ink)}

  footer{position:relative;z-index:3;text-align:center;padding:1rem 16px 1.4rem;font-size:.85rem;color:var(--ink-soft)}

  /* click-to-play layers */
  .splats{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .splat{position:absolute;border-radius:50%;filter:blur(18px);opacity:0}
  .fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
  .p{position:absolute;will-change:transform,opacity}
  .p svg{display:block;width:100%;height:100%;overflow:visible}

  /* ---------- oud sticker (sits next to "Under", dances with the music, tap to strum) ---------- */
  .oud{position:absolute;left:0;top:0;z-index:4;padding:0;margin:0;border:0;background:none;cursor:pointer;
       visibility:hidden;-webkit-tap-highlight-color:transparent}
  .oud.ready{visibility:visible}
  .oud:focus-visible{outline:3px dashed var(--ink);outline-offset:6px;border-radius:14px}
  .oud-in{display:block;width:100%;height:100%;transform-origin:50% 85%;
          animation:sway 3.2s ease-in-out infinite alternate}
  .oud svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 3px 0 var(--ink))}
  .oud-edge *{fill:#fff;stroke:#fff;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
  .o-body{fill:var(--butter);stroke:var(--ink);stroke-width:3}
  .o-inlay{fill:none;stroke:var(--pink-deep);stroke-width:2.4;stroke-dasharray:.5 5;stroke-linecap:round}
  .o-neck{fill:var(--lilac);stroke:var(--ink);stroke-width:3}
  .o-head{fill:var(--peach);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
  .o-pegs{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
  .o-rose{fill:var(--pink);stroke:var(--ink);stroke-width:2.5}
  .o-rose-in{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:2 2.2}
  .o-guard{fill:var(--lilac);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
  .o-ink{fill:var(--ink)}
  .str{fill:none;stroke:var(--ink);stroke-width:.9;opacity:.75}
  @keyframes sway{from{transform:rotate(7deg) translateY(0)}to{transform:rotate(17deg) translateY(-5%)}}
  @keyframes jam{                               /* on the beat of the music (96 bpm) */
    0%,50%,100%{transform:rotate(12deg) translateY(0) scale(1.05,.95)}
    25%{transform:rotate(1deg) translateY(-9%) scale(.97,1.04)}
    75%{transform:rotate(23deg) translateY(-9%) scale(.97,1.04)}
  }
  .jamming .oud-in{animation:jam 1.25s ease-in-out infinite}
  .jamming .oud .str{animation:buzz .09s linear infinite alternate}
  @keyframes buzz{to{transform:translateX(.7px)}}
  .oud-note{font:700 1.7rem/1 "Fredoka",sans-serif;-webkit-text-stroke:1.3px var(--ink);paint-order:stroke fill;
            text-shadow:2px 2px 0 var(--ink)}

  @media (max-width:640px){
    .headline{font-size:11.8vw}
    .name{letter-spacing:.16em}
    .d5,.d6{display:none}
    .d1{top:3%;left:4%}
    .d2{top:4%;right:4%}
    .d3{bottom:4%;left:4%}
    .d4{bottom:3%;right:4%}
  }
  @media (prefers-reduced-motion:reduce){
    .blob,.doodle,.ch,.dot,.fill,.fill::before,.eq i,.oud-in,.oud .str{animation:none!important}
    .oud-in{transform:rotate(12deg)}
    .fill{width:72%}
    .scribble path{animation:none;stroke-dashoffset:0}
  }
</style>
</head>
<body>

<div class="blobs" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <span class="blob b4"></span><span class="blob b5"></span>
</div>
<div class="splats" aria-hidden="true"></div>

<!-- floating doodles -->
<svg class="doodle d1" viewBox="0 0 40 40" style="color:var(--butter)" aria-hidden="true">
  <path class="f" d="M20 3l4.9 10.6 11.6 1.3-8.6 7.9 2.4 11.4L20 28.4 9.7 34.2l2.4-11.4L3.5 14.9l11.6-1.3z"/>
</svg>
<svg class="doodle d2" viewBox="0 0 40 40" style="color:var(--lilac)" aria-hidden="true">
  <path class="sq-o" d="M3 24c5-10 9-10 12 0s7 10 11 0 8-10 11 0"/>
  <path class="sq-i" d="M3 24c5-10 9-10 12 0s7 10 11 0 8-10 11 0"/>
</svg>
<svg class="doodle d3" viewBox="0 0 40 40" style="color:var(--pink)" aria-hidden="true">
  <g class="f"><circle cx="20" cy="9.5" r="7"/><circle cx="30" cy="16.8" r="7"/><circle cx="26.2" cy="28.5" r="7"/><circle cx="13.8" cy="28.5" r="7"/><circle cx="10" cy="16.8" r="7"/></g>
  <circle class="f" cx="20" cy="19.5" r="5" style="fill:var(--butter)"/>
</svg>
<svg class="doodle d4" viewBox="0 0 40 40" style="color:var(--mint)" aria-hidden="true">
  <circle class="ring-o" cx="20" cy="20" r="13"/><circle class="ring-i" cx="20" cy="20" r="13"/>
</svg>
<svg class="doodle d5" viewBox="0 0 40 40" style="color:var(--peach)" aria-hidden="true">
  <path class="f" d="M20 35S4 25 4 14a8 8 0 0 1 16-2 8 8 0 0 1 16 2c0 11-16 21-16 21z"/>
</svg>
<svg class="doodle d6" viewBox="0 0 40 40" style="color:var(--sky)" aria-hidden="true">
  <path class="f" d="M20 2c1.5 10 6.5 15 16.5 18-10 3-15 8-16.5 18-1.5-10-6.5-15-16.5-18 10-3 15-8 16.5-18z"/>
</svg>

<main>
  <p class="name"><span class="fl">✿</span><span data-name>MUSE Art &amp; Photography</span><span class="fl">✿</span></p>
  <p class="pill"><span class="dot"></span>coming soon</p>

  <div class="title-wrap">
    <h1 class="headline"><span class="word">Under</span> <span class="word">maintenance</span></h1>
    <!-- oud sticker -->
    <button class="oud" type="button" aria-label="Strum the oud">
      <span class="oud-in">
        <svg viewBox="0 0 100 180" aria-hidden="true">
          <g class="oud-edge">
            <path d="M50 58C66 58 92 90 92 121S73 173 50 173 8 152 8 121 34 58 50 58Z"/>
            <rect x="43" y="18" width="14" height="60" rx="3"/>
            <path d="M44 22 28 3Q31-1 36 1L57 22Z"/>
            <path d="M39.2 16.3l-5.4 4.5M35.2 11.6l-5.4 4.5M31.2 6.8l-5.4 4.5M50.7 15.7l4.9-4.9M45.5 10.5l4.9-4.9M40.2 5.2l4.9-4.9"/>
          </g>
          <path class="o-body" d="M50 58C66 58 92 90 92 121S73 173 50 173 8 152 8 121 34 58 50 58Z"/>
          <path class="o-inlay" transform="translate(50 121) scale(.86) translate(-50 -121)" d="M50 58C66 58 92 90 92 121S73 173 50 173 8 152 8 121 34 58 50 58Z"/>
          <circle class="o-rose" cx="31" cy="97" r="4.5"/><circle class="o-ink" cx="31" cy="97" r="1.3"/>
          <circle class="o-rose" cx="69" cy="97" r="4.5"/><circle class="o-ink" cx="69" cy="97" r="1.3"/>
          <circle class="o-rose" cx="50" cy="113" r="12"/>
          <circle class="o-rose-in" cx="50" cy="113" r="7.5"/><circle class="o-ink" cx="50" cy="113" r="2.6"/>
          <path class="o-guard" d="M36 135Q50 129 64 135Q60 150 50 152Q40 150 36 135Z"/>
          <path class="o-pegs" d="M39.2 16.3l-5.4 4.5M35.2 11.6l-5.4 4.5M31.2 6.8l-5.4 4.5M50.7 15.7l4.9-4.9M45.5 10.5l4.9-4.9M40.2 5.2l4.9-4.9"/>
          <path class="o-head" d="M44 22 28 3Q31-1 36 1L57 22Z"/>
          <rect class="o-neck" x="43" y="18" width="14" height="60" rx="3"/>
          <g class="str"><path d="M45 158 46.6 21M47.5 158 48.3 21M50 158V21M52.5 158 51.7 21M55 158 53.4 21"/></g>
          <rect class="o-ink" x="36" y="155" width="28" height="5.5" rx="2.2"/>
        </svg>
      </span>
    </button>
  </div>

  <p class="sub">…coming back in a whole <span class="scribble">new way<svg viewBox="0 0 160 20" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M3 13C30 5 52 18 82 10S132 4 157 12"/></svg></span> ✦</p>

  <div class="loader" aria-hidden="true">
    <div class="bar"><span class="fill"></span></div>
    <p class="loader-text" id="loaderText">mixing colors…</p>
  </div>

  <div class="actions">
    <nav class="socials" aria-label="Find us online"></nav>
    <button class="music" type="button" aria-pressed="false">
      <svg class="note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="music-label">play music</span>
    </button>
  </div>

  <p class="hint" id="hint">psst… click anywhere ✿</p>
</main>

<footer>© <span id="year">2026</span> <span data-name>MUSE Art &amp; Photography</span><span id="byline"> · by <span data-owner>Raghad Ali</span></span></footer>

<div class="grain" aria-hidden="true"></div>

<script>
(function(){
  var S = window.SITE || {};
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch  = window.matchMedia && matchMedia('(hover: none)').matches;
  var COLORS = ['var(--lilac)','var(--peach)','var(--mint)','var(--sky)','var(--pink)','var(--butter)'];
  var HEX    = ['#cdb8ff','#ffc8a8','#b4efd2','#b3dbff','#ffb6d9','#fff0a3'];
  var rnd  = function(a,b){ return a + Math.random()*(b-a); };
  var pick = function(arr){ return arr[Math.floor(Math.random()*arr.length)]; };

  /* name + year */
  var name = (S.name || '').trim();
  document.querySelectorAll('[data-name]').forEach(function(el){ el.textContent = name; });
  if (!name) document.querySelector('.name').hidden = true;
  var owner = (S.owner || '').trim();
  document.querySelectorAll('[data-owner]').forEach(function(el){ el.textContent = owner; });
  if (!owner) document.getElementById('byline').hidden = true;
  document.title = (name ? name + ' · ' : '') + 'under maintenance ✿';
  document.getElementById('year').textContent = new Date().getFullYear();

  /* bouncy headline letters */
  var h1 = document.querySelector('.headline');
  h1.setAttribute('aria-label', h1.textContent.replace(/\s+/g,' ').trim());
  var n = 0;
  h1.querySelectorAll('.word').forEach(function(w){
    var txt = w.textContent; w.textContent = ''; w.setAttribute('aria-hidden','true');
    Array.from(txt).forEach(function(c){
      var s = document.createElement('span');

    var on = !!Music && musicOn && Music.running();
    musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    musicLabel.textContent = on ? 'pause music' : 'play music';
    jam(on);
  }
  function setMusic(on){
    musicOn = on;
    if (on) Music.play(); else Music.pause();
    showMusic();
  }
  function unlock(e){
    if (!musicOn) return;
    if (Music.running()){
      UNLOCK.forEach(function(t){ document.removeEventListener(t, unlock, true); });
      return;
    }
    if (e.target && e.target.closest && e.target.closest('.music')) return;   // the button handles itself
    Music.play();
  }
  if (Music){
    Music.onchange = showMusic;
    musicBtn.addEventListener('click', function(){
      if (musicOn && !Music.running()){ Music.play(); showMusic(); return; }
      setMusic(!musicOn);
    });
    UNLOCK.forEach(function(t){ document.addEventListener(t, unlock, true); });
    document.addEventListener('visibilitychange', function(){
      if (!musicOn) return;
      if (document.hidden) Music.pause(); else Music.play();
    });
    Music.play();
  } else {
    musicBtn.hidden = true;
  }

  /* the oud dances while the music plays and floats little notes; tap it to strum */
  var oudBtn = document.querySelector('.oud'), noteTimer = null, NOTE_CH = ['♪','♫','♩','♬'];
  function oudNote(){
    if (reduce || document.hidden) return;
    var r = oudBtn.getBoundingClientRect();
    if (!r.width) return;
    var n = document.createElement('span');
    n.className = 'p oud-note';
    n.textContent = pick(NOTE_CH);
    n.style.cssText = 'left:' + (r.left + r.width * .5) + 'px;top:' + (r.top + r.height * .05) + 'px;color:' + pick(HEX);
    fx.appendChild(n);
    n.animate([{ transform:'translate(0,0) scale(.5)', opacity:0 },
               { opacity:1, offset:.2 },
               { transform:'translate(' + rnd(8, 50) + 'px,' + (-rnd(45, 90)) + 'px) rotate(' + rnd(-30, 30) + 'deg) scale(1.1)', opacity:0 }],
              { duration:1600, easing:'ease-out', fill:'forwards' }).onfinish = function(){ n.remove(); };
  }
  function jam(on){
    document.body.classList.toggle('jamming', on);
    if (on && !noteTimer) noteTimer = setInterval(oudNote, 1250);
    if (!on && noteTimer){ clearInterval(noteTimer); noteTimer = null; }
  }
  oudBtn.addEventListener('click', function(){
    if (Music){
      if (!(musicOn && Music.running())) setMusic(true);
      Music.strum();
    }
    oudBtn.animate([{ transform:'scale(1) rotate(0deg)' }, { transform:'scale(1.2) rotate(-10deg)' },
                    { transform:'scale(.94) rotate(6deg)' }, { transform:'scale(1) rotate(0deg)' }],
                   { duration:520, easing:'ease-out' });
    for (var k = 0; k < 3; k++) setTimeout(oudNote, k * 130);
  });

  function hintFor(c){
    if (c >= 50) return '<b>' + c + '</b> splashes… you really like it here 💜';
    if (c >= 25) return '<b>' + c + '</b> splashes, certified art legend ✦';
    if (c >= 10) return '<b>' + c + '</b> splashes, you\'re an artist now 🎨';
    return '<b>' + c + '</b> splash' + (c > 1 ? 'es' : '') + ' made, keep going ✿';
  }

  document.addEventListener('pointerdown', function(e){
    if (e.button > 0) return;
    if (e.target.closest('a, button')) return;
    var ch = e.target.closest('.ch');
    if (ch){
      var ci = (+ch.dataset.ci + 1) % COLORS.length;
      ch.dataset.ci = ci;
      ch.style.setProperty('--c', COLORS[ci]);
      ch.animate({ scale:[1, 1.35, 1] }, { duration:420, easing:'cubic-bezier(.3,1.6,.5,1)' });
    }
    splash(e.clientX, e.clientY);
    count++;
    hint.innerHTML = hintFor(count);
  });
})();
</script>
</body>
